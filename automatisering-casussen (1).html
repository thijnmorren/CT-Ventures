.diff-badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px}

.diff-2{background:#faeeda;color:#633806}
.diff-3{background:#faece7;color:#712b13}
.time-save{font-size:12px;color:#8a8885;white-space:nowrap}
.chevron{font-size:16px;color:#8a8885;transition:transform .2s;flex-shrink:0}
.card.open .chevron{transform:rotate(180deg)}
.card-body{display:none;padding:0 18px 18px;border-top:1px solid #dedad4}
.card.open .card-body{display:block}

.section-text{font-size:13px;color:#4a4845;line-height:1.6}
.tools-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tool{font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid #dedad4;color:#4a4845;background:#f5f3ef}
.tool.kern{background:#e1f5ee;border-color:#9ad4b4;color:#085041;font-weight:500}
.skills-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.skill{font-size:12px;padding:3px 9px;border-radius:6px;background:#eaf3de;border:1px solid #a8cf7a;color:#27500a}

.dot-email{background:#185FA5}
.dot-admin{background:#0F6E56}
.dot-planning{background:#854F0B}
.dot-klant{background:#993C1D}

.dot-data{background:#3B6D11}
.footer{margin-top:32px;padding-top:20px;border-top:1px solid #dedad4;font-size:12px;color:#8a8885}

</head>

// ================================================================

const DOT_CLASS = {offerte:"dot-offerte",email:"dot-email",admin:"dot-admin",planning:"dot-planning",klant:"dot-klant",marketing:"dot-marketing",data:"dot-data"};

// Filters opbouwen
const filtersEl = document.getElementById('filters');
const allBtn = document.createElement('button');
allBtn.className='filter-btn active'; allBtn.dataset.cat='all'; allBtn.textContent='Alle casussen';
allBtn.addEventListener('click',()=>filterOp('all',allBtn));
filtersEl.appendChild(allBtn);
CATEGORIES.forEach(c=>{
  const b=document.createElement('button');
  b.className='filter-btn'; b.dataset.cat=c.id; b.textContent=c.label;
  b.addEventListener('click',()=>filterOp(c.id,b));
  filtersEl.appendChild(b);
});

// Casussen renderen

  const kernSet=new Set(c.kerntools||[]);
  const card=document.createElement('div');
  card.className='card'; card.dataset.cat=c.cat;
  card.innerHTML=`<div class="card-header" onclick="toggle(this)">
    <span class="cat-dot ${DOT_CLASS[c.cat]||''}"></span>
    <span class="card-title">${c.titel}</span>
    <div class="badges">
      <span class="diff-badge ${c.diffClass}">${c.diff}</span>
      <span class="time-save">${c.tijdsbesparing}</span>
    </div>
    <span class="chevron">&#8964;</span>
  </div>
  <div class="card-body">
    <div class="section-lbl">Het probleem</div>
    <div class="section-text">${c.probleem}</div>
    <div class="section-lbl">De oplossing</div>
    <div class="section-text">${c.oplossing}</div>
    <div class="section-lbl">Tools</div>
    <div class="tools-row">${(c.tools||[]).map(t=>`<span class="tool${kernSet.has(t)?' kern':''}">${t}</span>`).join('')}</div>
    <div class="section-lbl">Skills om te leren</div>
    <div class="skills-row">${(c.skills||[]).map(s=>`<span class="skill">${s}</span>`).join('')}</div>
  </div>`;
  grid.appendChild(card);
});

updateCount();

function filterOp(cat,btn){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.card').forEach(card=>{
    card.classList.toggle('hidden', cat!=='all' && card.dataset.cat!==cat);
  });
  updateCount();
}

function updateCount(){
  const zichtbaar=document.querySelectorAll('.card:not(.hidden)').length;
  document.getElementById('count-lbl').textContent=zichtbaar+' casus'+(zichtbaar===1?'':'sen');
}

function toggle(h){
  const c=h.closest('.card');
  c.classList.toggle('open');
}
</script>
</body>
</html>
